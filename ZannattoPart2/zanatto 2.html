<!DOCTYPE html>
<html>
    <head>
        <title>Calculadora de Ponto de Equilíbrio</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      </head>
      <body>
        <div class="container">
          <h1>Calculadora de Ponto de Equilíbrio</h1>
        
          <form id="calculator">
            <fieldset> 

              <h3>Valores de Custo: <input type="number" id="custoV" ></h3>
              <h3>Preco de Venda: <input type="number" id="preco"></h3>
              <h3>Custo Medio dos Celulares: <input type="number" id="custoC"></h3>
          
      </fieldset>
            
            <button type="button" style="margin-left: 25px; margin-top: 10px; border-radius: 30px; width: 100px; height: 40px;" onclick="calcularBreakEven()">Resultado:</button>
          </form>
      
          <div class="chart-container">
            <button id="fecharbotaochart" onclick="fecharchart()" style="display: none;">Voltar</button>
            <p id="breakeventpoint"></p>
            <canvas id="myChart" width="500" height="500"></canvas>
          </div>
        </div>
      
        <script>
          var myChart;
      
          function calcularBreakEven() {
            var custofixo = parseFloat(document.getElementById('custoV').value);
            var precodevenda = parseFloat(document.getElementById('preco').value);
            var precodecusto = parseFloat(document.getElementById('custoC').value);
            
            var breakEvenQuantity = Math.ceil(custofixo / (precodevenda - precodecusto));
            
            document.getElementById('breakeventpoint').innerHTML = "Ponto de equilíbrio: " + breakEvenQuantity;
            
            atualizarchart(custofixo, precodevenda, precodecusto, breakEvenQuantity);
            document.getElementById('fecharbotaochart').style.display = 'block';
          }
          
          function atualizarchart(fixedcustos, precodevenda, precodecusto, breakEvenQuantity) {
            var ctx = document.getElementById('myChart').getContext('2d');
            var labels = [];
            var revenueData = [];
            var custoData = [];
            
            if (myChart) {
              myChart.destroy();
            }
            
            for (var quantity = 0; quantity <= 200; quantity += 5) {
              labels.push(quantity.toString());
              revenueData.push(quantity * precodevenda);
              custoData.push(fixedcustos + quantity * precodecusto);
            }
            
            myChart = new Chart(ctx, {
              type: 'line',
              data: {
                labels: labels,
                datasets: [
                  {
                    label: 'receita',
                    data: revenueData,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    fill: false
                  },
                  {
                    label: 'custo',
                    data: custoData,
                    borderColor: 'rgba(255, 99, 132, 1)',
                    fill: false
                  }
                ]
              },
              options: {
                scales: {
                  x: {
                    title: {
                      display: true,
                      text: 'quantidade vendida'
                    }
                  },
                  y: {
                    title: {
                      display: true,
                      text: 'valor'
                    }
                  }
                }
              }
            });
          }
      
          function fecharchart() {
            if (myChart) {
              myChart.destroy();
              document.getElementById('fecharbotaochart').style.display = 'none';
              document.getElementById('breakeventpoint').innerHTML = "";
            }
          }
        </script>
      </body>
</html>
