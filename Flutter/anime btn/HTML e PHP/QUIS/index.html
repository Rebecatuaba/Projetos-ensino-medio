<!DOCTYPE html>
<html>
<head>
	<title></title>
	<link rel="stylesheet" type="text/css" href="css\materialize.css">
</head>

<style type="text/css">
body{
	background-image: url("Dom Preso I.jpeg");
	background-size: 100% 125%;
	background-repeat: no-repeat;
}
span{
	 font-size: 25px;
	 color: white;
	 text-shadow: 
    -2px -2px 1px black, 
    -2px 2px 1px black,                    
     2px -2px 1px black,                  
     2px 2px 1px black;
     font-family: impact;
}
#resposta
{
	width: 400px;
	height: 400px;
	border-radius: 50%;
}

</style>
<body>
	<center><h1 style="size: 50%; color: white;text-shadow: 
    -2px -2px 1px green, 
    -2px 2px 1px red,                    
     2px -2px 1px green,                  
     2px 2px 1px red;
     font-family: impact;">Pergunta(s)</h1>
		<h1 style="size: 50%; color: white;text-shadow: 
    -2px -2px 1px purple, 
    -2px 2px 1px blue,                    
     2px -2px 1px purple,                  
     2px 2px 1px blue;
     font-family: impact;">Que tipo de Shitpost você gosta?</h1>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
	<form>
		<label><input type="radio" name="op" ><span>Esqueleto matador</span></label>
		<label><input type="radio" name="op"><span>Elmo cheira pó</span></label>
		<label><input type="radio" name="op"><span>Futebol de anão</span></label>
		<label><input type="radio" name="op"><span>Rinoscerroce</span></label>
		<label><input type="radio" name="op"><span>Tacos</span></label>
		<label><input type="radio" name="op"><span>Pirimpimpim</span></label>
		<label><input type="radio" name="op"><span>Saia</span></label>
		<label><input type="radio" name="op"><span>Wood paraguaio</span></label>
	</form>
	<br>
	<button style="width: 100px; height: 40px; border-radius: 15px" type="button" onclick="exibir()">Ratata</button>
	<br><br><br>
	<div id="resposta"></div>
	<h4 style="color: white;text-shadow: 
    -2px -2px 1px gray, 
    -2px 2px 1px black,                    
     2px -2px 1px gray,                  
     2px 2px 1px black;
     font-family: impact;" id="texto"></h4>
	</center>

	<script type="text/javascript">
		function exibir() {
			resp=document.getElementsByName("op");
			imagem=document.getElementById("resposta");
			h=document.getElementById("texto");

			if(resp[0].checked){
				imagem.style.backgroundImage="url('Skeleton.png')";
				imagem.style.backgroundSize="400px 400px";
				h.innerHTML="Eu queria colocar um gif. Mas um gif eu posso colocar";
			}

			else if(resp[1].checked){
				imagem.style.backgroundImage="url('Farinha de pão.jpg')";
				imagem.style.backgroundSize="400px 400px";
				h.innerHTML="Padeiro profissional (suspeito)";
			}
			else if(resp[2].checked){
				imagem.style.backgroundImage="url('anao.gif')";
				imagem.style.backgroundSize="400px 400px";
				h.innerHTML="Alexandre... O chutador de criança!";
			}
			else if(resp[3].checked){
				imagem.style.backgroundImage="url('Ace saindo do anus.jpg')";
				imagem.style.backgroundSize="400px 400px";
				h.innerHTML="A natureza é linda, não?";
			}
			else if(resp[4].checked){
				imagem.style.backgroundImage="url('tacos.jpg')";
				imagem.style.backgroundSize="400px 400px";
				h.innerHTML="Sim... Estoy en Peida";
			}
			else if(resp[5].checked){
				imagem.style.backgroundImage="url('kirbypirinpiplin.jpg')";
				imagem.style.backgroundSize="400px 400px";
				h.innerHTML="Kirby que comeu o pão do Elmo";
			}
			else if(resp[6].checked){
				imagem.style.backgroundImage="url('saia.jpg')";
				imagem.style.backgroundSize="400px 400px";
				h.innerHTML="Saia de pancake";
			}
			else if(resp[7].checked){
				imagem.style.backgroundImage="url('wood do paraguaio.jpg')";
				imagem.style.backgroundSize="400px 400px";
				h.innerHTML="Achei você!";
			}
		}

	</script>
			
</body>
</html>
